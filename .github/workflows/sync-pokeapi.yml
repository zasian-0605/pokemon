name: Build local PokeAPI data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - data/**
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game
        uses: actions/checkout@v4

      - name: Clone PokeAPI static data
        run: git clone --depth 1 https://github.com/PokeAPI/api-data.git .pokeapi

      - name: Build compact game data
        run: node scripts/build-poke-data.mjs

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update local PokeAPI data"
          git push
