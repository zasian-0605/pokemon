name: Game checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check game.js
      - run: node --check server.js
      - name: Start local game server
        run: PORT=4173 node server.js > /tmp/pokemon-server.log 2>&1 &
      - name: Start Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          nohup "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --user-data-dir=/tmp/pokemon-chrome about:blank > /tmp/pokemon-chrome.log 2>&1 </dev/null &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/pokemon-chrome.log
          exit 1
      - run: node tests/browser-smoke.mjs
