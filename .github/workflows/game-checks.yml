name: Game checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --check game.js
      - run: node --check server.js
      - name: Start local game server
        run: PORT=4173 node server.js > /tmp/pokemon-server.log 2>&1 &
      - name: Start Chromium
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/pokemon-chrome about:blank > /tmp/pokemon-chrome.log 2>&1 &
          sleep 2
      - run: node tests/browser-smoke.mjs
