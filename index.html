<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18222c"><title>MONSTER VEIL - 星境の冒険</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="titleScreen" class="screen">
    <div class="logo-orb">✦</div><h1>MONSTER VEIL</h1><p>星境の冒険</p>
    <div class="title-copy">人間とモンスターが、同じ世界で生きる。<br>戦うだけが、仲間になる方法じゃない。</div>
    <button id="newGameBtn" class="primary">はじめる</button><button id="loadGameBtn">つづきから</button>
    <div class="tiny">この作品はオリジナルのモンスターと世界観で作られたブラウザゲームです。</div>
  </div>
  <div id="starterScreen" class="screen hidden"><h2>最初の相棒を選ぼう</h2><p class="muted">炎・草・水。君と旅をしたい子を選んでください。</p><div id="starterList" class="starter-grid"></div></div>
  <div id="gameScreen" class="hidden">
    <header><div><strong>MONSTER VEIL</strong><span id="areaName" class="pill">はじまりの原</span></div><div class="header-actions"><span id="routeLabel" class="pill">BALANCE</span><button id="saveBtn">セーブ</button></div></header>
    <main class="layout">
      <section class="world-card card"><div id="world" aria-label="フィールド"><div class="sky-glow"></div><div class="path p1"></div><div class="path p2"></div><div class="water"></div><div class="grass g1"></div><div class="grass g2"></div><div class="grass g3"></div><div class="rocks r1"></div><div class="rocks r2"></div><div id="otherPlayers"></div><div id="player"></div></div>
      <div class="movement"><button data-move="up">▲</button><div><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div></div><div id="message" class="message">草むらが風に揺れている。</div></section>
      <aside class="side-column">
        <section class="card panel"><div class="section-head"><h3>相棒</h3><span id="partyCount">1 / 6</span></div><div id="partyList"></div></section>
        <section class="card panel"><h3>オンライン</h3><div id="onlineStatus" class="muted">オフライン</div><button id="onlineBtn">つながる</button><div id="roomInfo" class="small"></div><div id="chatLog" class="chat"></div><div class="chat-row"><input id="chatInput" maxlength="120" placeholder="チャット"><button id="chatSend">送信</button></div></section>
        <section class="card panel"><h3>旅の情報</h3><div class="stats-row"><span>Lv</span><b id="levelLabel">3</b></div><div class="stats-row"><span>経験値</span><b id="xpLabel">0 / 38</b></div><div class="stats-row"><span>つかまえた数</span><b id="caughtLabel">1</b></div><button id="bagBtn">どうぐ・図鑑</button></section>
      </aside>
    </main>
  </div>
  <div id="battleScreen" class="screen hidden"><div class="battle-wrap">
    <div class="battle-top"><div><span id="enemyLabel">野生</span><h2 id="enemyName">モンスター</h2><div class="muted" id="enemyMeta">Lv.3</div></div><div class="hp-box"><div class="hp-bar"><span id="enemyHp"></span></div><div id="enemyHpText">30 / 30</div></div></div>
    <div class="battle-arena"><div id="enemyMonster" class="monster-art"></div><div id="battleFx"></div><div id="heroMonster" class="monster-art"></div></div>
    <div class="player-bar"><div><b id="heroName">相棒</b><div class="muted" id="heroMeta">Lv.3</div></div><div class="hp-box"><div class="hp-bar"><span id="heroHp"></span></div><div id="heroHpText">30 / 30</div></div></div>
    <div id="battleLog" class="battle-log">どうする？</div><div id="moveGrid" class="move-grid hidden"></div>
    <div class="battle-menu"><button data-action="fight">たたかう</button><button data-action="talk">はなす</button><button data-action="catch">つかまえる</button><button data-action="item">どうぐ</button><button data-action="run">にげる</button></div>
  </div></div>
  <div id="modal" class="modal hidden"><div class="modal-inner"><button id="modalClose" class="modal-close">×</button><div id="modalBody"></div></div></div>
</div>
<script type="module" src="game.js"></script>
</body></html>
