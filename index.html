<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポケットモンスター 星巡り</title><link rel="stylesheet" href="/styles.css"></head><body>
<div id="app">
<section id="title" class="screen"><div class="title-logo"><div class="ball"></div></div><div class="title-small">POCKET MONSTER FAN GAME</div><h1>ポケットモンスター</h1><h2>星巡り</h2><button id="start" class="pixel-button red">はじめから</button><button id="continue" class="pixel-button">つづきから</button><p class="notice">独自マップ・独自ストーリー / Pokémon data via PokéAPI</p></section>
<section id="cutscene" class="screen hidden"><canvas id="scene" width="640" height="360"></canvas><div class="text-window"><div id="speaker"></div><div id="text"></div><span id="nextMark">▼</span></div><button id="sceneNext" class="pixel-button">A</button><button id="sceneSkip" class="pixel-button small-button">スキップ</button></section>
<section id="starter" class="screen hidden"><div class="panel starter-panel"><div class="panel-title">博士の研究所</div><p>3つのモンスターボールから、旅の相棒を選ぼう。</p><div id="starterList" class="starter-list"></div></div></section>
<section id="world" class="screen hidden"><div class="game-wrap"><div class="map-frame"><canvas id="map" width="640" height="480"></canvas><div id="mapText" class="map-text"></div><div class="touch-dpad"><button data-touch="up">▲</button><div><button data-touch="left">◀</button><button data-touch="down">▼</button><button data-touch="right">▶</button></div></div></div><aside class="hud"><div class="hud-card"><div class="place" id="place"></div><div id="money"></div><div id="badges"></div></div><div class="hud-card"><div class="hud-title">てもち</div><div id="party"></div></div><div class="hud-card controls"><b>操作</b><span>WASD / 矢印</span><span>E / A：調べる</span><span>ESC：メニュー</span></div><button id="save" class="pixel-button">セーブ</button><button id="online" class="pixel-button">オンライン</button><div id="onlineInfo" class="online-info">オフライン</div><button id="menu" class="pixel-button">メニュー</button></aside></div></section>
<section id="battle" class="screen hidden"><div class="battle-wrap"><canvas id="battleCanvas" width="960" height="540"></canvas><div class="battle-ui"><div class="battle-name enemy"><b id="enemyName"></b><span id="enemyLevel"></span><div class="hp"><i id="enemyHP"></i></div></div><div class="battle-name player"><b id="playerName"></b><span id="playerLevel"></span><div class="hp"><i id="playerHP"></i></div></div><div id="battleMessage" class="battle-message">どうする？</div><div id="battleCommands" class="battle-commands"><button data-cmd="fight">たたかう</button><button data-cmd="bag">バッグ</button><button data-cmd="pokemon">ポケモン</button><button data-cmd="run">にげる</button></div><div id="moves" class="moves hidden"></div><div id="bag" class="moves hidden"><button data-item="potion">キズぐすり</button><button data-item="pokeball">モンスターボール</button><button data-item="back">もどる</button></div><div id="switches" class="moves hidden"></div></div></div></section>
<div id="menuPanel" class="overlay hidden"><div class="panel"><button id="closeMenu">×</button><h2>メニュー</h2><button id="dex">ポケモンずかん</button><button id="heal">ポケモンセンター</button><button id="closeMenu2">もどる</button><div id="menuInfo"></div></div></div>
</div><script type="module" src="/game.js"></script></body></html>
