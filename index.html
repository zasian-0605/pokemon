<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d62828">
<title>ポケットモンスター 星巡りの旅</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <section id="titleScreen" class="screen title-screen">
    <div class="pokeball-logo"><span></span></div>
    <h1>ポケットモンスター</h1>
    <h2>星巡りの旅</h2>
    <p>ポケモンと出会い、育て、戦い、仲間にしよう。</p>
    <div class="title-buttons">
      <button id="newGame" class="big primary">はじめから</button>
      <button id="loadGame" class="big">つづきから</button>
    </div>
    <p class="tiny">ファンゲーム / 独自ストーリー・独自マップ</p>
  </section>

  <section id="introScreen" class="screen intro-screen hidden">
    <div class="intro-frame">
      <canvas id="introCanvas" width="960" height="540" aria-label="冒険のはじまり"></canvas>
      <div id="introText" class="intro-text">……。</div>
      <div class="intro-controls"><button id="introNext" class="big primary">つぎへ</button><button id="skipIntro">スキップ</button></div>
    </div>
  </section>

  <section id="starterScreen" class="screen hidden">
    <div class="box starter-box">
      <h2>最初のポケモン</h2>
      <p class="muted">旅の相棒を1匹選んでください。</p>
      <div id="starterGrid" class="starter-grid"></div>
    </div>
  </section>

  <section id="gameScreen" class="screen hidden">
    <header class="topbar">
      <div><b>ポケットモンスター 星巡りの旅</b><span id="placeName" class="route-pill">星見町</span></div>
      <div class="top-actions">
        <span id="badgeCount" class="route-pill">バッジ 0</span>
        <button id="saveButton">セーブ</button>
        <button id="menuButton">メニュー</button>
      </div>
    </header>

    <main class="game-layout">
      <section class="box field-box">
        <canvas id="field" width="900" height="600" aria-label="フィールド"></canvas>
        <div class="field-tip">WASD / 矢印キー / 画面ボタンで移動　Eで人や施設を調べる</div>
        <div class="dpad">
          <button data-dir="up">▲</button>
          <div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
        </div>
        <div id="fieldMessage" class="dialog">ポケモンといっしょに旅に出よう。</div>
      </section>

      <aside class="side">
        <section class="box party-box">
          <div class="section-title"><h3>手持ち</h3><span id="partySize">0 / 6</span></div>
          <div id="partyList"></div>
        </section>

        <section class="box side-box">
          <h3>冒険情報</h3>
          <div class="statline"><span>図鑑</span><b id="dexCount">0</b></div>
          <div class="statline"><span>所持金</span><b id="money">3000円</b></div>
          <div class="statline"><span>バッジ</span><b id="badgeText">0</b></div>
          <div class="progress"><span id="storyProgress"></span></div>
        </section>

        <section class="box side-box">
          <h3>オンライン</h3>
          <div id="onlineState" class="muted">オフライン</div>
          <button id="onlineButton">オンライン</button>
          <div id="roomText" class="small"></div>
          <div id="chatLog" class="chat"></div>
          <div class="chat-row"><input id="chatInput" maxlength="120" placeholder="チャット"><button id="chatSend">送信</button></div>
        </section>
      </aside>
    </main>
  </section>

  <section id="battleScreen" class="screen battle-screen hidden">
    <div class="battle-card">
      <div class="battle-header">
        <div>
          <span id="battleKind" class="muted">野生のポケモン</span>
          <h2 id="enemyName">？？？</h2>
          <div id="enemyMeta"></div>
        </div>
        <div class="hp-wrap"><div class="hp-caption">HP</div><div class="hp"><span id="enemyHpBar"></span></div><div id="enemyHpText"></div></div>
      </div>

      <div class="battle-scene">
        <img id="enemySprite" class="enemy-sprite" alt="">
        <div id="battleEffect" class="battle-effect"></div>
        <img id="playerSprite" class="player-sprite" alt="">
      </div>

      <div class="battle-header player-status">
        <div><b id="playerMonName"></b><div id="playerMonMeta"></div></div>
        <div class="hp-wrap"><div class="hp-caption">HP</div><div class="hp"><span id="playerHpBar"></span></div><div id="playerHpText"></div></div>
      </div>

      <div id="battleText" class="battle-text">どうする？</div>
      <div id="movePanel" class="move-panel hidden"></div>
      <div id="battleMenu" class="battle-menu">
        <button data-battle="fight">たたかう</button>
        <button data-battle="bag">バッグ</button>
        <button data-battle="pokemon">ポケモン</button>
        <button data-battle="run">にげる</button>
      </div>
      <div id="bagPanel" class="sub-panel hidden">
        <button data-item="potion">キズぐすり</button>
        <button data-item="pokeball">モンスターボール</button>
        <button data-item="back">もどる</button>
      </div>
      <div id="switchPanel" class="sub-panel hidden"></div>
    </div>
  </section>

  <div id="menuModal" class="modal hidden">
    <div class="modal-card">
      <button id="menuClose" class="modal-close">×</button>
      <h2>メニュー</h2>
      <button id="pokedexButton">ポケモンずかん</button>
      <button id="partyButton">ポケモン</button>
      <button id="bagButton">バッグ</button>
      <button id="mapButton">マップ</button>
    </div>
  </div>
  <div id="dialogModal" class="modal hidden">
    <div class="modal-card wide">
      <button id="dialogClose" class="modal-close">×</button>
      <div id="dialogContent"></div>
    </div>
  </div>
</div>
<script type="module" src="/game.js"></script>
</body>
</html>
